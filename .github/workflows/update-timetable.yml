name: Update official timetable
on:
  schedule:
    - cron: '17 17 * * 1'   # Tuesdays 01:17 Beijing time
  workflow_dispatch:
    inputs:
      pairs:
        description: 'crawl scope: known (2025-table pairs plus every pair that had a schedule), all (every domestic city pair), matrix, 2025'
        default: 'known'
      workers:
        description: 'concurrent sessions (new.hnair.com cuts GitHub-hosted runners off above roughly 10-20 queries/min)'
        default: '2'
      limit:
        description: 'stop after this many queries (0 = no limit; for diagnostics)'
        default: '0'
      delay:
        description: 'seconds to pause between queries per worker'
        default: '0'
      rate:
        description: 'cap of queries per minute across all workers (0 = none)'
        default: '15'
permissions:
  contents: write
  actions: write
concurrency:
  group: update-timetable
  cancel-in-progress: false
jobs:
  crawl:
    # new.hnair.com rate-limits GitHub-hosted runners (about 165 queries, then connections are dropped for
    # some minutes), so the weekly schedule refreshes the known pairs at 15 queries/min (about 3 hours). Set the repository variable CRAWL_RUNNER to the
    # label of a self-hosted runner (e.g. in mainland China) to crawl the full matrix (--pairs all) from there.
    runs-on: ${{ vars.CRAWL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh the official location list
        run: python scripts/crawl-official-timetable.py cities
      - name: Refresh airport coordinates (OurAirports, for airports new to the map)
        run: python scripts/fetch-airport-codes.py
      - name: Crawl the official timetable
        run: python scripts/crawl-official-timetable.py crawl --refresh --pairs "${{ github.event.inputs.pairs || 'known' }}" --workers "${{ github.event.inputs.workers || '2' }}" --limit "${{ github.event.inputs.limit || '0' }}" --delay "${{ github.event.inputs.delay || '0' }}" --rate "${{ github.event.inputs.rate || '15' }}"
      - name: Crawl summary
        run: python scripts/crawl-official-timetable.py summary
      # a diagnostic run (limit > 0) stops here: partial data is never built or committed
      - name: Rebuild assets from the official data
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: python scripts/build-flights.py
      - uses: actions/setup-node@v4
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        with:
          node-version: 22
          cache: npm
      - if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: npm ci
      - if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: npm run build
      - if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: node scripts/smoke-test.mjs dist/index.html
      - name: Commit and push the new data
        id: commit
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official/timetable/cities.json data/official/timetable/rows.jsonl data/airports/ourairports-cn.csv src/assets/flights.json src/assets/coverage.json src/assets/airports.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no data change"
          else
            git commit -m "Update official timetable data ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the refreshed site
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
